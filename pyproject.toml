[project]
name = "tatha"
version = "1.0.0"
description = "Predictive Coding + Quantum Active Inference Agent System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "websockets>=12.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0.0"]
web = ["matplotlib", "aiohttp"]
benchmarks = ["tqdm>=4.65.0", "prometheus-client>=0.19.0"]

[project.scripts]
tatha = "tatha_realtime:main"
tatha-bench = "tatha_benchmarks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
